<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    color: var(--figma-color-text, #111);
    background: var(--figma-color-bg, #fff);
    padding: 16px;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .title {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
  }
  .hint {
    font-size: 11px;
    color: var(--figma-color-text-secondary, #6b7280);
    line-height: 1.45;
  }
  ol { margin: 0; padding-left: 18px; }
  ol li { font-size: 11px; line-height: 1.6; color: var(--figma-color-text-secondary, #6b7280); }
  input {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--figma-color-border, #d1d5db);
    border-radius: 6px;
    font-size: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
    outline: none;
    background: var(--figma-color-bg, #fff);
    color: var(--figma-color-text, #111);
  }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
  button.primary {
    height: 36px;
    border: 0;
    border-radius: 6px;
    background: #4f46e5;
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  button.primary:hover { background: #4338ca; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.link {
    background: none;
    border: 0;
    color: var(--figma-color-text-secondary, #6b7280);
    font-size: 11px;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: none;
  }
  button.link:hover { color: var(--figma-color-text, #111); text-decoration: underline; }
  .msg {
    font-size: 11px;
    min-height: 14px;
    line-height: 1.4;
  }
  .msg.error { color: #dc2626; }
  .msg.success { color: #059669; }
  .msg.info { color: #4f46e5; }
  .footer {
    margin-top: 4px;
    text-align: center;
    border-top: 1px solid var(--figma-color-border, #e5e7eb);
    padding-top: 8px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="./ui.js"></script>
</body>
</html>
